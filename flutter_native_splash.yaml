# Native splash: only the bus on the brand blue, no text (the Android 12+
# system splash cannot show text anyway). Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0038A8"
  image: assets/splash_icon.png
  color_dark: "#00266F"
  image_dark: assets/splash_icon.png
  android_12:
    color: "#0038A8"
    image: assets/splash_icon_android12.png
    icon_background_color: "#0038A8"
    color_dark: "#00266F"
    image_dark: assets/splash_icon_android12.png
    icon_background_color_dark: "#00266F"
  ios: true
  web: false
